<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111719" />
    <meta
      name="description"
      content="A quiet workspace for your projects, skills, documents, and ideas."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MyVault OS" />
    <title>Home · MyVault OS</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-180.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="stylesheet" href="styles.css?v=constellation-3" />
    <link rel="stylesheet" href="qwen.css?v=1" />
    <link rel="stylesheet" href="constellation.css?v=4" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <section
      id="constellation-background"
      class="constellation-background"
      aria-label="Interactive MyVault project and skill constellation"
    ></section>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace">
        <a class="brand" href="#home" aria-label="MyVault OS constellation background"
          ><span class="brand-mark" aria-hidden="true">⬡</span
          ><span class="brand-text"
            >MyVault<span class="brand-os">OS</span></span
          ></a
        >
        <div class="workspace-label">
          <span class="presence-dot"></span><span>PERSONAL WORKSPACE</span>
        </div>
        <nav class="nav-list" aria-label="Main navigation">
          <button
            class="nav-link"
            type="button"
            data-view="home"
            aria-current="page"
          >
            <span data-icon="constellation"></span
            ><span class="nav-label">Constellation</span>
          </button>
          <button class="nav-link" type="button" data-view="control">
            <span data-icon="home"></span
            ><span class="nav-label">Dashboard</span>
          </button>
          <span class="nav-section">YOUR VAULT</span>
          <button class="nav-link" type="button" data-view="projects">
            <span data-icon="projects"></span
            ><span class="nav-label">Projects</span
            ><span class="nav-count" data-count="projects">0</span>
          </button>
          <button class="nav-link" type="button" data-view="skills">
            <span data-icon="skills"></span><span class="nav-label">Skills</span
            ><span class="nav-count" data-count="skills">0</span>
          </button>
          <button class="nav-link" type="button" data-view="docs">
            <span data-icon="docs"></span
            ><span class="nav-label">Documents</span
            ><span class="nav-count" data-count="docs">0</span>
          </button>
          <button class="nav-link" type="button" data-view="chats">
            <span data-icon="chats"></span><span class="nav-label">Chats</span
            ><span class="nav-count" data-count="chats">0</span>
          </button>
          <button class="nav-link" type="button" data-view="tasks">
            <span data-icon="tasks"></span><span class="nav-label">Monthly Task</span
            ><span class="nav-count" data-count="tasks">0</span>
          </button>
          <span class="nav-section">EXPLORE</span>
          <button class="nav-link" type="button" data-view="build">
            <span data-icon="build"></span
            ><span class="nav-label">Build / Repair</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <div class="workspace-avatar">M</div>
          <div>
            <strong>Your personal OS</strong
            ><span>A little more connected.</span>
          </div>
        </div>
        <button
          class="sidebar-collapse"
          id="sidebar-collapse"
          type="button"
          aria-label="Collapse sidebar"
          aria-expanded="true"
        >
          ← <span>Collapse sidebar</span>
        </button>
      </aside>
      <div class="workspace">
        <div class="utility-bar">
          <div class="breadcrumb">
            Workspace <span>/</span> <strong id="view-title">Home</strong>
          </div>
          <div class="utility-actions">
            <button
              class="button button-quiet"
              id="ask-qwen"
              type="button"
              aria-haspopup="dialog"
              aria-controls="qwen-panel"
            >
              Ask Qwen
            </button>
            <span class="sync-indicator" id="sync-indicator"
              >Local workspace</span
            ><button
              class="button button-quiet"
              id="login-button"
              type="button"
            >
              Sign in with GitHub
            </button>
          </div>
        </div>
        <main id="main" tabindex="-1">
          <div class="workspace-toolbar">
            <div class="global-search-wrap">
              <span data-icon="search"></span
              ><label class="visually-hidden" for="global-search"
                >Search your vault</label
              ><input
                id="global-search"
                type="search"
                placeholder="Search your vault…"
                autocomplete="off"
              /><kbd>/</kbd>
            </div>
            <button class="button" id="save-button" type="button" disabled>
              Saved locally
            </button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite">
            Your workspace is ready.
          </p>
          <div id="view"></div>
          <footer class="main-footer">
            <span
              >MyVault OS <span class="footer-dot">·</span> A home for what
              you’re building.</span
            ><span id="workspace-date"></span>
          </footer>
        </main>
      </div>
    </div>
    <dialog id="item-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="app.js?v=constellation-4"></script>
    <script type="module" src="qwen.mjs?v=1"></script>
  </body>
</html>
